<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KC FUTURA Karriereleiter</title></head><body><div id="boot" style="font-family:system-ui;padding:2rem">Karriereleiter wird geladen …</div><script src="payload-1.js"></script><script src="payload-2.js"></script><script src="payload-3.js"></script><script src="payload-4.js"></script><script src="payload-5.js"></script><script src="payload-6.js"></script><script src="payload-7.js"></script><script src="payload-8.js"></script><script>async function boot(){const bin=Uint8Array.from(atob(window.KC_KL_PAYLOAD||''),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(text);document.close()}boot().catch(e=>document.getElementById('boot').textContent='Startfehler: '+e.message);</script></body></html>
