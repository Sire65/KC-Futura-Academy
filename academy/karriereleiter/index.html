<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102d4c"><title>KC FUTURA · Karriereleiter 1.3.1</title><style>html,body{margin:0;min-height:100%;background:#071523;color:#fff;font-family:Segoe UI,system-ui,Arial,sans-serif}#boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:2rem;box-sizing:border-box}#boot b{display:block;font-size:1.3rem;margin-bottom:.5rem}#boot small{color:#d8e5ee}#boot code{display:block;margin-top:.6rem;color:#f0c776}</style></head><body><div id="boot"><div><b>KC FUTURA · Karriereleiter</b><small>Build 1.3.1 wird integritätsgeprüft geladen …</small><code>a1b4fe0d473f</code></div></div><script>
const EXPECTED_HTML_SHA='a1b4fe0d473fcaae468b41b25981cd454c2a2d4f691627e88666ed8b6bb4ed8a';const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');async function digestText(t){return hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))}async function digestBytes(b){return hex(await crypto.subtle.digest('SHA-256',b))}
async function boot(){try{const m=await fetch('BUILD_MANIFEST.json?release=1.3.1',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Manifest fehlt');return r.json()});if(m.version!=='1.3.1')throw new Error('Falsche Release-Version: '+m.version);let encoded='';for(const p of m.deployment.payload_parts){const t=await fetch(p.file+'?release=1.3.1',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Payload fehlt: '+p.file);return r.text()});if(await digestText(t)!==p.sha256)throw new Error('Payload-Prüfsumme falsch: '+p.file);encoded+=t.trim()}const bin=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));if(typeof DecompressionStream!=='function')throw new Error('Aktueller Browser erforderlich.');const bytes=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();const got=await digestBytes(bytes);if(got!==EXPECTED_HTML_SHA||got!==m.deployment.html_sha256)throw new Error('Build-Prüfsumme stimmt nicht.');document.open();document.write(new TextDecoder().decode(bytes));document.close()}catch(e){const el=document.getElementById('boot');if(el)el.innerHTML='<div><b>Karriereleiter konnte nicht gestartet werden.</b><small>'+String(e&&e.message||e)+'</small></div>';console.error(e)}}boot();</script></body></html>
