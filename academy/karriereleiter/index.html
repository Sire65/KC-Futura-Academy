<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102d4c"><title>KC FUTURA · Karriereleiter</title><style>html,body{margin:0;min-height:100%;background:#071523;color:#fff;font-family:Segoe UI,system-ui,Arial,sans-serif}#boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:2rem;box-sizing:border-box}#boot b{display:block;font-size:1.3rem;margin-bottom:.5rem}#boot small{color:#d8e5ee}</style></head><body><div id="boot"><div><b>KC FUTURA · Karriereleiter</b><small>Fachwissen, Lernkarten und Prüfungsvorbereitung werden geladen …</small></div></div><script src="seg-01.js"></script><script src="seg-02.js"></script><script src="seg-03.js"></script><script src="seg-04.js"></script><script src="seg-05.js"></script><script src="seg-06.js"></script><script src="seg-07.js"></script><script src="seg-08.js"></script><script src="seg-09.js"></script><script>async function boot(){try{if(!window.KC_KL_PAYLOAD)throw new Error('Modulpaket fehlt');if(typeof DecompressionStream!=='function')throw new Error('Dieser Browser unterstützt den sicheren Modul-Loader nicht. Bitte aktuelle Chrome-, Edge- oder Safari-Version verwenden.');const bin=Uint8Array.from(atob(window.KC_KL_PAYLOAD),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();window.KC_KL_PAYLOAD='';document.open();document.write(text);document.close()}catch(e){const el=document.getElementById('boot');if(el)el.innerHTML='<div><b>Karriereleiter konnte nicht gestartet werden.</b><small>'+String(e&&e.message||e)+'</small></div>';console.error('Karriereleiter boot',e)}}boot();</script></body></html>
