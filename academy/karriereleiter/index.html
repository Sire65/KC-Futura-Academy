<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102d4c"><title>KC FUTURA · Karriereleiter</title><style>html,body{margin:0;min-height:100%;background:#071523;color:#fff;font-family:Segoe UI,system-ui,Arial,sans-serif}#boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:2rem;box-sizing:border-box}#boot b{display:block;font-size:1.3rem;margin-bottom:.5rem}#boot small{color:#d8e5ee}</style><script src="runtime/manifest.js"></script></head><body><div id="boot"><div><b>KC FUTURA · Karriereleiter</b><small id="bootStatus">Fachwissen, Lernkarten und Prüfungsvorbereitung werden geprüft und geladen …</small></div></div><script>
(()=>{'use strict';
const status=document.getElementById('bootStatus');
const fail=e=>{const el=document.getElementById('boot');if(el)el.innerHTML='<div><b>Karriereleiter konnte nicht gestartet werden.</b><small>'+String(e&&e.message||e)+'</small></div>';console.error('Karriereleiter boot',e)};
const load=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.async=false;s.onload=resolve;s.onerror=()=>reject(new Error('Runtime-Datei fehlt: '+src));document.head.appendChild(s)});
const hex=buf=>Array.from(new Uint8Array(buf),b=>b.toString(16).padStart(2,'0')).join('');
async function boot(){
 try{
  const r=window.KC_KL_RUNTIME;if(!r||r.version!=='1.2.0'||!Number.isInteger(r.chunkCount))throw new Error('Runtime-Manifest ungültig');
  const ctx=window.parent&&window.parent!==window?window.parent.KCFuturaModuleContext:null;
  if(ctx?.learningStore){window.KCFutura=window.KCFutura||{};window.KCFutura.learningStore=ctx.learningStore}
  window.KC_KL_PAYLOAD='';
  for(let i=1;i<=r.chunkCount;i++){if(status)status.textContent=`Karriereleiter wird geladen … ${i}/${r.chunkCount}`;await load(`runtime/chunk-${String(i).padStart(3,'0')}.js?v=${encodeURIComponent(r.version)}`)}
  if(!window.KC_KL_PAYLOAD)throw new Error('Modulpaket fehlt');
  if(typeof DecompressionStream!=='function')throw new Error('Dieser Browser unterstützt den sicheren Modul-Loader nicht. Bitte einen aktuellen Browser verwenden.');
  const bin=Uint8Array.from(atob(window.KC_KL_PAYLOAD),c=>c.charCodeAt(0));
  const text=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  const digest=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)));
  if(digest!==r.sha256)throw new Error('Integritätsprüfung des Karriereleiter-Builds fehlgeschlagen');
  window.KC_KL_PAYLOAD='';document.open();document.write(text);document.close();
 }catch(e){fail(e)}
}
boot();
})();
</script></body></html>
