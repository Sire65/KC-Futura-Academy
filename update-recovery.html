<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><title>KC FUTURA aktualisiert</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,Segoe UI,Arial;background:#0b2942;color:#102234}.box{width:min(560px,calc(100% - 32px));background:#fff;border-radius:22px;padding:28px;box-sizing:border-box}.track{height:16px;background:#dfe9ef;border-radius:99px;overflow:hidden}.bar{height:100%;width:5%;background:#16875b;transition:width .25s}.muted{color:#526473}button{padding:12px 17px;border:0;border-radius:12px;background:#16875b;color:#fff;font-weight:800}</style></head><body><main class="box"><h1>Academy wird aktualisiert</h1><p id="msg">Bitte einen Moment warten. Die Aktualisierung läuft automatisch.</p><div class="track"><div class="bar" id="bar"></div></div><p class="muted" id="phase">Vorbereitung …</p><button id="retry" hidden>Erneut versuchen</button></main><script>
(async()=>{const q=new URLSearchParams(location.search),target=q.get('target')||'',ret=q.get('return')||'academy/index.html',bar=document.getElementById('bar'),phase=document.getElementById('phase'),msg=document.getElementById('msg'),retry=document.getElementById('retry');const step=(p,t)=>{bar.style.width=p+'%';phase.textContent=t};try{step(15,'Alte Browserdaten werden gelöst …');if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}step(45,'Zwischenspeicher wird bereinigt …');if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}step(70,'Neue Programmdateien werden angefordert …');await fetch('latest-release-manifest.json?force='+Date.now(),{cache:'reload'});await fetch('academy/version.json?force='+Date.now(),{cache:'reload'});step(95,'Academy wird neu gestartet …');const u=new URL(ret,location.href);u.searchParams.set('release',target);u.searchParams.set('force',Date.now()+'_'+Math.random().toString(36).slice(2));setTimeout(()=>location.replace(u.toString()),300)}catch(e){msg.textContent='Die Aktualisierung konnte momentan nicht abgeschlossen werden. Die bisherige Version bleibt nutzbar.';phase.textContent='Bitte später erneut versuchen.';retry.hidden=false;retry.onclick=()=>location.reload()}})();
</script></body></html>
